name: Build Xbox 360 default.xex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay-tests:
    name: Host gameplay core regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Compile gameplay tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Iinclude \
            src/game.c tests/test_game.c -o gameplay-tests
      - name: Run gameplay tests
        run: ./gameplay-tests

  build-xex:
    name: Build and validate default.xex
    runs-on: ubuntu-latest
    needs: gameplay-tests
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install XSDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Check out XSDK
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Pre-fetch verified GNU toolchain sources from mirrors
        run: |
          set -euo pipefail
          SRC="$HOME/xsdk-gcc-work/src"
          mkdir -p "$SRC"
          fetch_verified() {
            local archive="$1" expected="$2"
            shift 2
            for url in "$@"; do
              echo "Trying $url"
              if curl --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 2 -fLsS "$url" -o "$SRC/$archive.tmp"; then
                if echo "$expected  $SRC/$archive.tmp" | sha256sum -c --quiet; then
                  mv "$SRC/$archive.tmp" "$SRC/$archive"
                  return 0
                fi
                echo "Checksum mismatch from $url" >&2
                rm -f "$SRC/$archive.tmp"
              fi
            done
            echo "Unable to fetch verified source: $archive" >&2
            return 1
          }
          fetch_verified binutils-2.47.tar.xz 154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff \
            https://mirrors.kernel.org/gnu/binutils/binutils-2.47.tar.xz \
            https://ftp.osuosl.org/pub/gnu/binutils/binutils-2.47.tar.xz
          fetch_verified gcc-15.3.0.tar.xz fa59c1beef8995f27c4d71c1df227587189315d3e6faff1bb4306e61b0c530eb \
            https://mirrors.kernel.org/gnu/gcc/gcc-15.3.0/gcc-15.3.0.tar.xz \
            https://ftp.osuosl.org/pub/gnu/gcc/gcc-15.3.0/gcc-15.3.0.tar.xz
          fetch_verified newlib-4.6.0.20260123.tar.gz 6ff27e3bf022666f43f7802255be680eeff722ac181b1725d21e2e8318604ee3 \
            https://sourceware.org/pub/newlib/newlib-4.6.0.20260123.tar.gz

      - name: Build XSDK PowerPC toolchain
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS="$(nproc)" bash tools/toolchain/build.sh

      - name: Build XSDK runtime and libraries
        run: |
          cd "$HOME/xsdk"
          make -j"$(nproc)" TOOLCHAIN="$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-"

      - name: Configure GTA 6 Xbox 360 title
        run: |
          cmake -S . -B build/xsdk-title -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile and package XEX2
        run: |
          cmake --build build/xsdk-title --parallel
          test -s build/xsdk-title/gta6.xex
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/xsdk-title/gta6.xex")
          data = p.read_bytes()
          if data[:4] != b"XEX2":
              raise SystemExit("Output does not have XEX2 magic")
          print(f"XEX2 header verified: {p} ({len(data)} bytes)")
          PY
          cp build/xsdk-title/gta6.xex default.xex
          test -s default.xex

      - name: Upload final Xbox 360 executable
        uses: actions/upload-artifact@v4
        with:
          name: GTA-6-Xbox-360-default-xex
          path: default.xex
          if-no-files-found: error
