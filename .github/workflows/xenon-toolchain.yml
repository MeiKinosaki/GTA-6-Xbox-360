name: Xenon toolchain and ELF build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xenon-build:
    name: Build Xenon ELF with Free60 LibXenon
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pull Free60 LibXenon build image
        run: docker pull free60/libxenon:latest

      - name: Compile and verify Xenon ELF
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            free60/libxenon:latest \
            bash -lc 'export DEVKITXENON=/usr/local/xenon; export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"; make clean verify-elf toolchain-info'

      - name: Upload Xenon ELF build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xenon-elf-bootstrap
          path: |
            Xenon.elf
            Xenon.elf32
            build/*.o
          if-no-files-found: error
